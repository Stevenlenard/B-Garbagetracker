name: garbage_tracking_app
description: A garbage tracking and management application
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^2.32.0
  firebase_database: ^10.5.0
  intl: ^0.19.0
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  fl_chart: ^0.68.0
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  mapbox_maps_flutter: ^3.0.0-alpha.1
  url_launcher: ^6.3.0
  pointer_interceptor: ^0.10.1+2
  google_generative_ai: ^0.4.0
  pdf: ^3.11.1
  printing: ^5.13.2
  flutter_local_notifications: ^17.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/